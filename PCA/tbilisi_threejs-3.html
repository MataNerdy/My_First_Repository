<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Tbilisi Walk — Three.js</title>
<style>
  html,body{margin:0;height:100%;overflow:hidden;background:#87b7d8;font-family:Arial,sans-serif}
  #info{position:fixed;left:16px;top:16px;z-index:10;color:white;background:#0009;
    padding:12px 14px;border-radius:10px;line-height:1.45;user-select:none}
  #cross{position:fixed;left:50%;top:50%;width:5px;height:5px;background:white;border-radius:50%;
    transform:translate(-50%,-50%);z-index:9;box-shadow:0 0 4px #000}
  #start{position:fixed;inset:0;display:grid;place-items:center;z-index:20;background:#0008;color:white}
  #start button{font-size:18px;padding:14px 24px;border:0;border-radius:10px;cursor:pointer}
</style>
</head>
<body>
<div id="info">
  <b>Тбилиси — мини-бегалка</b><br>
  WASD — ходить · мышь — смотреть<br>
  Shift — быстрее · Esc — отпустить мышь
</div>
<div id="cross"></div>
<div id="start"><button>Нажми, чтобы войти в Тбилиси</button></div>

<script type="module">
import * as THREE from 'https://cdn.jsdelivr.net/npm/three@0.180.0/build/three.module.js';

const scene = new THREE.Scene();
scene.background = new THREE.Color(0x87b7d8);
scene.fog = new THREE.Fog(0x87b7d8, 35, 180);

const camera = new THREE.PerspectiveCamera(75, innerWidth/innerHeight, .1, 300);
camera.position.set(0,1.7,18);

const renderer = new THREE.WebGLRenderer({antialias:true});
renderer.setSize(innerWidth,innerHeight);
renderer.setPixelRatio(Math.min(devicePixelRatio,2));
renderer.shadowMap.enabled = true;
renderer.shadowMap.type = THREE.PCFSoftShadowMap;
document.body.appendChild(renderer.domElement);

// Свет
scene.add(new THREE.HemisphereLight(0xbfe7ff,0x6b4b32,2.1));
const sun = new THREE.DirectionalLight(0xffe2b0,3);
sun.position.set(-50,80,30);
sun.castShadow = true;
sun.shadow.mapSize.set(2048,2048);
scene.add(sun);

// Материалы
const mat = (color, rough=.9) => new THREE.MeshStandardMaterial({color,roughness:rough});
const roadMat=mat(0x343638), sidewalkMat=mat(0xaaa49a), stoneMat=mat(0x927d6c);
const wallMats=[mat(0xc69b72),mat(0xd6b48c),mat(0x9f765f),mat(0xe0c6a0),mat(0x7e6b60)];
const roofMat=mat(0x5b4036), windowMat=new THREE.MeshStandardMaterial({color:0x233b4b,roughness:.25,metalness:.1});
const green=mat(0x426b43), treeTrunk=mat(0x5b3d27);

// Земля
const ground=new THREE.Mesh(new THREE.PlaneGeometry(260,260),mat(0x756b55));
ground.rotation.x=-Math.PI/2; ground.receiveShadow=true; scene.add(ground);

// Дорога и тротуары
function box(w,h,d,x,y,z,m,shadow=true){
  const o=new THREE.Mesh(new THREE.BoxGeometry(w,h,d),m);
  o.position.set(x,y,z); o.castShadow=shadow; o.receiveShadow=true; scene.add(o); return o;
}
box(18,.08,220,0,.04,0,roadMat,false);
box(3,.18,220,-10,.09,0,sidewalkMat,false);
box(3,.18,220,10,.09,0,sidewalkMat,false);

// Разметка
for(let z=-105;z<110;z+=8) box(.12,.025,4,0,.105,z,mat(0xd7d2b9),false);

// Тротуарные плитки
for(let z=-100;z<105;z+=3){
  box(2.7,.025,.06,-10,.2,z,stoneMat,false);
  box(2.7,.025,.06,10,.2,z,stoneMat,false);
}

// Дома: две стороны улицы
function building(x,z,w,d,h,i){
  const b=box(w,h,d,x,h/2+.18,z,wallMats[i%wallMats.length]);
  const roof=box(w+.18,.35,d+.18,x,h+.38,z,roofMat);
  // окна на фасаде
  const cols=Math.max(2,Math.floor(w/2));
  for(let c=0;c<cols;c++){
    for(let r=0;r<Math.max(1,Math.floor((h-1)/2));r++){
      const wx=x-w/2+(c+.5)*w/cols;
      const wz=z-d/2-.012;
      const win=box(.62,.78,.04,wx,1.35+r*1.65,wz,windowMat,false);
    }
  }
  return b;
}

let seed=17;
function rnd(){ seed=(seed*9301+49297)%233280; return seed/233280; }

for(let z=-100;z<105;z+=9){
  const h=5+rnd()*7, w=6+rnd()*4, d=7.5;
  building(-15-rnd()*3,z,w,d,h,Math.floor(rnd()*5));
  const h2=4.5+rnd()*8, w2=6+rnd()*4;
  building(15+rnd()*3,z,w2,d,h2,Math.floor(rnd()*5));
}

// Балконы
for(let z=-90;z<100;z+=18){
  box(3,.12,.8,-11.7,3.0,z,mat(0x4d3b31));
  box(3,.12,.8,11.7,3.0,z,mat(0x4d3b31));
}

// Деревья
function tree(x,z,s=1){
  box(.35*s,2*s,.35*s,x,1*s,z,treeTrunk);
  const crown=new THREE.Mesh(new THREE.SphereGeometry(1.5*s,10,8),green);
  crown.position.set(x,2.7*s,z); crown.castShadow=true; scene.add(crown);
}
for(let z=-100;z<105;z+=12){ tree(-8.2,z, .8+rnd()*.35); tree(8.2,z+5,.8+rnd()*.35); }

// Фоновые холмы
for(let i=0;i<12;i++){
  const hill=new THREE.Mesh(new THREE.SphereGeometry(16+rnd()*14,24,12),mat(0x65795a));
  hill.scale.y=.55;
  hill.position.set((rnd()-.5)*180,4,-110-rnd()*35);
  scene.add(hill);
}

// Условный указатель района
const sign=box(3.8,1.1,.15,-8.4,2.2,-12,mat(0x274b3a),false);
const canvas=document.createElement('canvas'); canvas.width=512; canvas.height=128;
const ctx=canvas.getContext('2d'); ctx.fillStyle='#fff'; ctx.font='bold 46px Arial';
ctx.fillText('ძველი თბილისი',24,78);
const tex=new THREE.CanvasTexture(canvas);
sign.material=new THREE.MeshBasicMaterial({map:tex});

// Скамейки
for(let z=-70;z<80;z+=28){
  box(2,.15,.5,-7.2,.65,z,mat(0x704a2e));
  box(.12,.7,.12,-7.9,.35,z,mat(0x444444));
  box(.12,.7,.12,-6.5,.35,z,mat(0x444444));
}

// Управление
const keys={};
addEventListener('keydown',e=>keys[e.code]=true);
addEventListener('keyup',e=>keys[e.code]=false);

let yaw=0,pitch=0,locked=false;
document.addEventListener('mousemove',e=>{
  if(!locked)return;
  yaw-=e.movementX*.0022;
  pitch-=e.movementY*.0022;
  pitch=Math.max(-1.45,Math.min(1.45,pitch));
});

const start=document.querySelector('#start');
start.querySelector('button').onclick=()=>document.body.requestPointerLock();
document.addEventListener('pointerlockchange',()=>{
  locked=document.pointerLockElement===document.body;
  start.style.display=locked?'none':'grid';
});

const clock=new THREE.Clock();
function animate(){
  requestAnimationFrame(animate);
  const dt=Math.min(clock.getDelta(),.05);
  const speed=(keys.ShiftLeft||keys.ShiftRight)?8:4.2;

  const forward=new THREE.Vector3(Math.sin(yaw),0,Math.cos(yaw));
  const right=new THREE.Vector3(Math.cos(yaw),0,-Math.sin(yaw));
  const move=new THREE.Vector3();

  if(keys.KeyW) move.add(forward);
  if(keys.KeyS) move.sub(forward);
  if(keys.KeyD) move.add(right);
  if(keys.KeyA) move.sub(right);

  if(move.lengthSq()) move.normalize().multiplyScalar(speed*dt);
  camera.position.add(move);

  // Не даём уйти с дороги слишком далеко
  camera.position.x=Math.max(-9.0,Math.min(9.0,camera.position.x));
  camera.position.z=Math.max(-105,Math.min(105,camera.position.z));

  camera.rotation.order='YXZ';
  camera.rotation.y=yaw;
  camera.rotation.x=pitch;

  renderer.render(scene,camera);
}
animate();

addEventListener('resize',()=>{
  camera.aspect=innerWidth/innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(innerWidth,innerHeight);
});
</script>
</body>
</html>
